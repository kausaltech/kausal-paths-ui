packages:
  - kausal_common
  - private/assistant
hoistPattern:
  - "@kausal/themes"
  - "@kausal-private/themes-private"
allowBuilds:
  "@parcel/watcher": false
  "@sentry-internal/node-cpu-profiler": false
  "@sentry/cli": false
  "@sentry/node-cpu-profiler": true
  "@swc/core": true
  es5-ext: false
  esbuild: false
  libxmljs2: false
  sharp: false
  unrs-resolver: false
dedupePeers: true
dedupePeerDependents: true
linkWorkspacePackages: false
strictPeerDependencies: true
resolvePeersFromWorkspaceRoot: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "typescript-eslint"
  - "@typescript-eslint/*"
  - "next"
  - "@next/*"
  - "@kausal/themes"
  - "@kausal-private/themes-private"
publicHoistPattern:
  - "@kausal/themes"
  - "@kausal-private/themes-private"
storeDir: ./.pnpm-store
overrides:
  "nanoid@<3.3.18": "^3.3.20"
  "uuid@<11.1.1": "^11.1.1"
  "@graphql-tools/utils@<12.0.1": "^12.0.3"
peerDependencyRules:
  allowedVersions:
    react: "19"
    react-dom: "19"
    yargs: "17"
