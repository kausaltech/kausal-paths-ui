packages:
  - kausal_common
  - private/assistant
allowBuilds:
  '@parcel/watcher': false
  '@sentry-internal/node-cpu-profiler': false
  '@sentry/cli': false
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  es5-ext: false
  esbuild: false
  libxmljs2: false
  sharp: false
  unrs-resolver: false
hoistPattern:
  - "@kausal/themes"
  - "@kausal-private/themes-private"
linkWorkspacePackages: false
overrides:
  graphql: ^16.14.2
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - 'typescript-eslint'
  - '@typescript-eslint/*'
  - 'next'
  - '@next/*'
  - '@kausal/themes'
  - '@kausal-private/themes-private'
publicHoistPattern:
  - "@kausal/themes"
  - "@kausal-private/themes-private"
storeDir: ./.pnpm-store
