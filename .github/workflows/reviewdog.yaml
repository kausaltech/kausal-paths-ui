name: reviewdog
on:
  pull_request:
  workflow_call:
    secrets:
      PRIVATE_SUBMODULE_DEPLOY_KEY:
        required: true

jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.PRIVATE_SUBMODULE_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Check out submodules
        run: |
          if ssh_command=$(git config --local core.sshCommand); then
            export GIT_SSH_COMMAND="$ssh_command"
          fi
          git submodule update --init --recursive --checkout

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile --no-optional

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.21.0

      - name: Run lint and typecheck
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          reviewdog -reporter=github-check -fail-level=warning -runners eslint || status=$?
          reviewdog -reporter=github-check -fail-level=error -runners typecheck || status=$?
          exit "$status"
